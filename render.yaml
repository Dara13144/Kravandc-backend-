        value: https://irdgcydgnsocsgybivvm.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_STORAGE_BUCKET
        value: kv-media
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
